<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>GUARD AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="popup-body">
  <button type="button" id="historyToggle" class="history-toggle" title="Заблоковані сайти">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z"/></svg>
    <span id="historyCount">0</span>
  </button>

  <div class="card">
    <h1 class="logo">GUARD AI</h1>
    <p class="subtitle">Захист від фішингу</p>

    <button type="button" id="button" class="btn btn-toggle">
      <span class="btn-text">...</span>
    </button>
    <p class="status-hint" id="statusHint"></p>

  </div>

  <div id="historyPanel" class="history-panel">
    <div class="history-header">
      <h2>Заблоковані</h2>
      <button type="button" id="clearHistory" class="btn-link">Очистити</button>
      <button type="button" id="historyClose" class="history-close" title="Закрити">×</button>
    </div>
    <ul id="historyList" class="history-list"></ul>
  </div>
  <script src="popup.js"></script>
</body>
</html>
